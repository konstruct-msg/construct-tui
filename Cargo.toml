[package]
name = "construct-tui"
license = "MPL-2.0"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/konstruct-msg/construct-tui"

[[bin]]
name = "konstruct"
path = "src/main.rs"

[features]
default = ["post-quantum"]
post-quantum = ["construct-client/post-quantum"]

[workspace]
members = ["crates/construct-client"]

[dependencies]
# Everything but the terminal: account, keys, the core, the stream, storage.
construct-client = { path = "crates/construct-client" }

# TUI
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
qrcode = { version = "0.14", default-features = false }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
zeroize = { version = "1", features = ["std"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-pq]
inherits = "release"
