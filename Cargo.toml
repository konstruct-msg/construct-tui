[package]
name = "construct-tui"
license = "MPL-2.0"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/konstruct-msg/construct-tui"

[[bin]]
name = "konstruct"
path = "src/main.rs"

[features]
default = ["post-quantum"]
post-quantum = ["construct-client/post-quantum", "construct-screens/post-quantum"]

[dependencies]
# Everything but the terminal lives in construct-client, checked out next to this repository:
# the client layer (account, keys, the core, the stream, storage) and the screens.
construct-client = { path = "../construct-client/crates/construct-client" }
construct-screens = { path = "../construct-client/crates/construct-screens" }

# The terminal. The same crossterm as ratatui's, so key events are one type.
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-pq]
inherits = "release"
